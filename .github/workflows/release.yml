# "v0.2.0" kabi teg yuborilganda Windows o'rnatuvchisini yig'ib, GitHub Release'ga joylaydi.
# Maktabdagi dasturlar shu Release'dan yangilanishni o'zi yuklab oladi.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Release'ni oldindan qoralama sifatida yaratamiz. Aks holda electron-builder fayllarni
      # parallel yuklayotganda bir teg uchun ikkita Release yaratib qo'yadi.
      - name: Qoralama Release yaratish
        shell: bash
        run: gh release create "$TAG" --draft --title "Bilim Arena ${TAG#v}" --notes-file .github/release-notes.md --verify-tag

      - run: npm run release

      - name: Release'ni e'lon qilish
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest

  # Windows o'rnatuvchisi Release'ni e'lon qilgach, Android APK ham shu Release'ga qo'shiladi.
  android:
    needs: windows
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
