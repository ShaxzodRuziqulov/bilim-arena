# "v0.2.0" kabi teg yuborilganda Windows o'rnatuvchisini yig'ib, GitHub Release'ga joylaydi.
# Maktabdagi dasturlar shu Release'dan yangilanishni o'zi yuklab oladi.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
